{% load static %}
<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ seo_title|default:"Gempa Indonesia — BMKG Monitor" }}{% endblock %}</title>

    <!-- SEO meta tags -->
    <meta name="description" content="{{ seo_description }}">
    <meta name="keywords" content="{{ seo_keywords }}">
    <meta name="author" content="{{ seo_author }}">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <link rel="canonical" href="{{ seo_canonical }}">
    <meta name="theme-color" content="{{ seo_theme_color }}">

    <!-- Favicon and Manifest -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon-16x16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'site.webmanifest' %}">
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}">
    <!-- Android Chrome Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'android-chrome-192x192.png' %}">
    <link rel="icon" type="image/png" sizes="512x512" href="{% static 'android-chrome-512x512.png' %}">

    <!-- Open Graph -->
    <meta property="og:type" content="{{ seo_og_type }}">
    <meta property="og:title" content="{{ seo_title }}">
    <meta property="og:description" content="{{ seo_description }}">
    <meta property="og:url" content="{{ seo_canonical }}">
    <meta property="og:site_name" content="{{ seo_og_site_name }}">
    <meta property="og:locale" content="{{ seo_og_locale }}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="{{ seo_twitter_card }}">
    <meta name="twitter:title" content="{{ seo_title }}">
    <meta name="twitter:description" content="{{ seo_description }}">

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">{{ seo_jsonld|safe }}</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        magma: {
                            50: '#fff3ed',
                            100: '#ffe4d5',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        },
                        abyss: {
                            900: '#05070c',
                            800: '#0c1220',
                        },
                        seismic: {
                            'intensity-i': '#4ade80',
                            'intensity-ii': '#84cc16',
                            'intensity-iii': '#facc15',
                            'intensity-iv': '#fb923c',
                            'intensity-v': '#f97316',
                            'intensity-vi': '#dc2626',
                            'intensity-vii': '#991b1b',
                            'intensity-viii': '#5b0000',
                        },
                    },
                    fontFamily: {
                        heading: ['Space Grotesk', 'sans-serif'],
                        body: ['IBM Plex Sans', 'sans-serif'],
                    },
                    boxShadow: {
                        seismic: '0 22px 48px -24px rgba(249,115,22,0.55)',
                        'seismic-lg': '0 25px 50px -24px rgba(249,115,22,0.65)',
                        'seismic-inner': 'inset 0 2px 4px 0 rgba(249,115,22,0.1)',
                        'seismic-wave': '0 0 40px rgba(249,115,22,0.3)',
                    },
                    animation: {
                        'seismic-pulse': 'seismic-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'seismic-ripple': 'seismic-ripple 2.5s ease-out forwards',
                        'seismic-shake': 'seismic-shake 0.5s cubic-bezier(0.36, 0, 0.66, 1)',
                        'seismic-glow': 'seismic-glow 3s ease-in-out infinite',
                    },
                    keyframes: {
                        'seismic-pulse': {
                            '0%, 100%': { transform: 'scale(1)', opacity: '1' },
                            '50%': { transform: 'scale(1.1)', opacity: '0.8' },
                        },
                        'seismic-ripple': {
                            '0%': { transform: 'scale(0.5)', opacity: '1' },
                            '100%': { transform: 'scale(2.5)', opacity: '0' },
                        },
                        'seismic-shake': {
                            '0%, 100%': { transform: 'translate(0, 0)' },
                            '25%': { transform: 'translate(-2px, -2px)' },
                            '50%': { transform: 'translate(2px, 2px)' },
                            '75%': { transform: 'translate(-1px, 1px)' },
                        },
                        'seismic-glow': {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(249,115,22,0.2)' },
                            '50%': { boxShadow: '0 0 40px rgba(249,115,22,0.4)' },
                        },
                    },
                    backdropBlur: {
                        xs: '2px',
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.2.2/css/dataTables.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.2.2/js/dataTables.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-full bg-slate-950 text-zinc-100 antialiased font-body">

    <div class="fixed inset-0 -z-10 bg-[radial-gradient(circle_at_10%_20%,rgba(249,115,22,0.18),transparent_35%),radial-gradient(circle_at_90%_10%,rgba(56,189,248,0.15),transparent_32%),linear-gradient(130deg,#020617_0%,#05070c_45%,#0b1120_100%)]"></div>
    <div class="fixed inset-x-0 top-0 -z-10 h-40 bg-gradient-to-b from-magma-500/20 via-magma-500/5 to-transparent"></div>

    <!-- Loading bar -->
    <div id="loading-bar" class="fixed left-0 top-0 z-50 h-1 w-0 bg-gradient-to-r from-magma-500 via-amber-400 to-sky-400 transition-all duration-300 ease-out"></div>

    <!-- Mobile top header -->
    <header class="fixed left-0 top-0 z-30 w-full border-b border-zinc-800/70 bg-slate-950/90 backdrop-blur md:hidden">
        <div class="flex items-center gap-3 px-4 py-3">
            <button onclick="toggleSidebar()"
                    class="rounded-xl border border-zinc-700/70 bg-zinc-900/70 p-2.5 text-zinc-200 transition hover:border-magma-500/70 hover:text-magma-300" aria-label="Toggle menu">
                <svg class="w-5 h-5 text-zinc-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <div class="flex items-center gap-2.5">
                <svg class="h-5 w-5 text-magma-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <span class="font-heading text-base font-semibold tracking-wide text-zinc-100">Seismic Lens</span>
            </div>
        </div>
    </header>

    <div class="mx-auto max-w-[1500px] pt-16 md:pt-0">
        <div class="flex min-h-screen flex-col lg:flex-row lg:gap-4 lg:px-4 lg:py-6 xl:px-6">
            {% include 'sidebar.html' %}

            <!-- Main content -->
            <div class="flex-1 lg:pl-[17rem]">
                <main class="px-3 pb-8 pt-4 sm:px-5 md:px-6 lg:px-7 lg:pt-2">
                    <div class="mx-auto w-full max-w-7xl translate-y-8 opacity-0 transition-all duration-700 ease-out" id="main-content">
                        {% block content %}{% endblock %}
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- Modals — direct <body> children so CSS fixed positioning uses the viewport, not a transformed ancestor -->
    {% block modals %}{% endblock %}

    <script src="{% static 'js/utils.js' %}"></script>
    <script src="{% static 'js/map.js' %}"></script>
    <script>
        // Sidebar toggle for mobile
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const bd = document.getElementById('sidebar-backdrop');
            const isOpen = !sb.classList.contains('-translate-x-full');
            if (isOpen) {
                sb.classList.add('-translate-x-full');
                bd.classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
            } else {
                sb.classList.remove('-translate-x-full');
                bd.classList.remove('hidden');
                document.body.classList.add('overflow-hidden');
            }
        }
        // Content entry animation
        document.addEventListener('DOMContentLoaded', function() {
            const mc = document.getElementById('main-content');
            if (mc) { requestAnimationFrame(() => { mc.classList.remove('opacity-0','translate-y-8'); mc.classList.add('opacity-100','translate-y-0'); }); }
            // Loading bar
            const lb = document.getElementById('loading-bar');
            if (lb) {
                lb.classList.add('w-[30%]');
                window.addEventListener('load', () => {
                    lb.classList.remove('w-[30%]');
                    lb.classList.add('w-full');
                    setTimeout(() => {
                        lb.classList.add('opacity-0');
                        setTimeout(() => lb.remove(), 300);
                    }, 350);
                });
            }
        });
        // Global Escape key — closes topmost visible modal
        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Escape') return;
            const ids = ['img-modal','analisis-modal','narasi-modal','detail-modal','history-modal'];
            for (const id of ids) {
                const el = document.getElementById(id);
                if (el && !el.classList.contains('hidden')) { GempaUtils.hideModal(id); break; }
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
