<dialog class="sheet" id="detail" aria-labelledby="detail-title">
  <div class="sheet__head">
    <span id="detail-badge"></span>
    <div>
      <h2 class="sheet__title" id="detail-title" tabindex="-1"></h2>
      <p class="sheet__sub" id="detail-sub"></p>
    </div>
    <button class="icon-btn sheet__close" type="button" data-close aria-label="Tutup">
      {{ icon("close") }}
    </button>
  </div>
  <div class="sheet__body" id="detail-body"></div>
</dialog>
