<!-- Narasi BMKG modal — reusable across felt/m5/tsunami/home pages -->
<div id="narasi-modal" class="hidden fixed inset-0 z-[55] flex items-center justify-center bg-black/75 p-4 backdrop-blur"
     onclick="if(event.target===this)GempaUtils.hideModal('narasi-modal')">
    <div class="flex max-h-[85vh] w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-zinc-700/70 bg-zinc-900 shadow-2xl shadow-black/60">
        <div class="flex shrink-0 items-center justify-between border-b border-zinc-700 px-6 py-4">
            <div class="flex items-center gap-2.5 min-w-0">
                <svg class="h-5 w-5 shrink-0 text-magma-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <h3 id="narasi-title" class="text-sm font-medium text-zinc-300 truncate">Narasi BMKG</h3>
            </div>
            <button onclick="GempaUtils.hideModal('narasi-modal')"
                    class="shrink-0 flex h-8 w-8 items-center justify-center rounded-lg text-zinc-400 transition hover:bg-zinc-800 hover:text-zinc-100">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div id="narasi-content" class="min-h-0 overflow-y-auto p-6 leading-relaxed text-zinc-300" data-narasi-styles></div>
    </div>
</div>
