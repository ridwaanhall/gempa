<!-- Section card component — consistent card wrapper for content sections -->
<!-- Usage: wrap content in this card for a consistent elevated panel look -->
<!-- Parameters: title (optional), title_id (optional), subtitle (optional), subtitle_id (optional), extra_class (optional) -->
<div class="overflow-hidden rounded-2xl border border-zinc-800/80 bg-zinc-900/60 shadow-lg shadow-black/25 backdrop-blur transition duration-300 hover:border-zinc-700/90 {{ extra_class }}">
    {% if title %}
    <div class="flex items-center justify-between border-b border-zinc-800 px-5 py-4">
        <h3 class="text-base font-semibold text-zinc-100 sm:text-lg">{{ title }}</h3>
        {% if subtitle_id %}
        <span id="{{ subtitle_id }}" class="text-xs text-zinc-400 sm:text-sm">{{ subtitle|default:'—' }}</span>
        {% elif subtitle %}
        <span class="text-xs text-zinc-400 sm:text-sm">{{ subtitle }}</span>
        {% endif %}
    </div>
    {% endif %}
    {{ content }}
</div>
