<!-- Image lightbox modal component — reusable across pages that show BMKG analysis images -->
<!-- JS sets #img-modal-src (src) and #img-modal-title (textContent) before showing -->
<div id="img-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/85 p-4 backdrop-blur"
     onclick="if(event.target===this)GempaUtils.hideModal('img-modal')">
    <div class="w-full max-w-5xl">
        <div class="flex justify-end mb-3">
            <button onclick="GempaUtils.hideModal('img-modal')"
                    class="flex h-10 w-10 items-center justify-center rounded-xl border border-zinc-700 bg-zinc-900/70 text-zinc-300 transition hover:border-magma-500/60 hover:text-magma-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <p id="img-modal-title" class="mb-3 text-center text-sm font-medium text-zinc-200"></p>
        <img id="img-modal-src" src="" alt="" class="mx-auto max-h-[75vh] rounded-2xl border border-zinc-700/70 shadow-2xl shadow-black/70">
    </div>
</div>
