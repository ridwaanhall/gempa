<!-- Detail modal component — reusable detail viewer for earthquake data -->
<!-- Used across: felt, m5, tsunami pages. JS populates #detail-title and #detail-content -->
<div id="detail-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4 backdrop-blur-sm"
     onclick="if(event.target===this)GempaUtils.hideModal('detail-modal')">
    <div class="flex max-h-[85vh] w-full max-w-4xl flex-col overflow-hidden rounded-3xl border border-zinc-700/50 bg-gradient-to-br from-zinc-900 to-slate-950 shadow-2xl shadow-black/60 backdrop-blur">
        <div class="flex shrink-0 items-center justify-between border-b border-zinc-700/50 bg-zinc-800/40 px-6 py-5">
            <h3 id="detail-title" class="text-base font-bold text-zinc-200 truncate pr-4 font-heading"></h3>
            <button onclick="GempaUtils.hideModal('detail-modal')"
                    class="shrink-0 flex h-8 w-8 items-center justify-center rounded-lg text-zinc-400 transition hover:bg-zinc-700 hover:text-zinc-100">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div id="detail-content" class="min-h-0 overflow-y-auto p-6 text-zinc-300"></div>
    </div>
</div>
